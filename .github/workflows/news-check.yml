name: News feed check

# Searches for new publications and press mentions, has Claude filter them,
# and opens a PR for review. Nothing publishes without that PR being merged.
#
# Runs on GitHub's servers rather than Joel's Mac, so it does not depend on the
# laptop being awake and cannot be broken by a local PATH or keychain problem.
#
# Requires repository secret: ANTHROPIC_API_KEY

on:
  schedule:
    # 07:23 UTC ~= 09:23 CEST / 08:23 CET. Deliberately off the hour: GitHub
    # queues scheduled runs and the top of the hour is the most contended slot.
    # Scheduled runs are best-effort regardless and can be delayed by hours.
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days back to search"
        required: false
        default: "30"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: news-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet anthropic

      - name: Fetch candidates
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '30' }}
        run: python3 scripts/fetch-news.py > /tmp/candidates.json

      - name: Stop if there are no candidates
        id: candidates
        run: |
          n=$(python3 -c "import json;print(len(json.load(open('/tmp/candidates.json'))))")
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Found $n candidates"

      - name: Filter with Claude
        if: steps.candidates.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/filter-news.py /tmp/candidates.json > /tmp/filtered.json

      - name: Merge into news.json
        if: steps.candidates.outputs.count != '0'
        id: merge
        run: |
          if python3 scripts/merge-news.py /tmp/filtered.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="news-update-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/news.json
          git commit -m "Add new items to news feed"
          git push origin "$BRANCH"
          gh pr create \
            --title "News feed update $(date -u +%Y-%m-%d)" \
            --body-file .github/news-pr-body.md \
            --base main --head "$BRANCH"
